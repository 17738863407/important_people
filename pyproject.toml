[project]
name = "important-people"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawler-core>=1.10",
    "lxml>=6.1.3",
    "openai>=3.17.0",
    "openpyxl>=3.1.5",
    "packaging>=26.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "psutil>=7.2.2",
    "pysocks>=1.7.1",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "send2trash>=2.1.0",
    "socksio>=1.0.0",
    "tqdm>=4.70.1",
    "urllib3>=2.8.0",
    "websocket-client>=1.9.2",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["workspace/tests"]
